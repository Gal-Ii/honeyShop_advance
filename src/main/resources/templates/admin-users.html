<!DOCTYPE html>
<html lang="bg" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>HoneyShop - Управление на потребители</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="top-strip">
    🐝 Добре дошли в HoneyShop — натурален мед и пчелни продукти
</div>

<header class="site-header">
    <div th:with="activePage='admin-users'"
         th:replace="~{fragments/navigation_bar :: nav-bar}">
    </div>
</header>

<section class="page-hero">
    <div class="container">
        <h1>Управление на потребители</h1>
        <p>
            Преглед, активиране и деактивиране на потребителски профили.
        </p>
    </div>
</section>

<section class="section">
    <div class="container">
        <div class="table-card">
            <div class="table-responsive">
                <table class="admin-products-table">
                    <thead>
                    <tr>
                        <th>Име</th>
                        <th>Email</th>
                        <th>Роля</th>
                        <th>Активен</th>
                        <th>Регистриран</th>
                        <th>Действия</th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:each="user : ${users}">
                        <td th:text="${user.name}">Име</td>
                        <td th:text="${user.email}">email@example.com</td>
                        <td>
                            <form th:if="${canManageRoles and user.role.name() != 'ADMIN'}"
                                  th:action="@{/admin/users/{id}/role(id=${user.id})}"
                                  method="post">

                                <select name="role">
                                    <option th:each="role : ${userRoles}"
                                            th:value="${role}"
                                            th:text="${role}"
                                            th:selected="${role == user.role}">
                                    </option>
                                </select>

                                <button class="btn light" type="submit">
                                    Запази роля
                                </button>
                            </form>

                            <span th:if="${!canManageRoles or user.role.name() == 'ADMIN'}"
                                  th:text="${user.role}">USER</span>
                        </td>
                        <td>
                            <span class="status-pill active-status"
                                  th:if="${user.isActive}">
                                Да
                            </span>

                            <span class="status-pill inactive-status"
                                  th:unless="${user.isActive}">
                                Не
                            </span>
                        </td>
                        <td th:text="${#temporals.format(
                                user.createdOn,
                                'dd.MM.yyyy HH:mm'
                        )}">
                            15.07.2026
                        </td>
                        <td>
                            <form th:if="${!user.isActive}"
                                  th:action="@{/admin/users/{id}/activate(
                                      id=${user.id}
                                  )}"
                                  method="post">
                                <button class="btn light" type="submit">
                                    Активирай
                                </button>
                            </form>

                            <form th:if="${user.isActive}"
                                  th:action="@{/admin/users/{id}/deactivate(
                                      id=${user.id}
                                  )}"
                                  method="post">
                                <button class="btn dark" type="submit">
                                    Деактивирай
                                </button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</section>

<footer class="site-footer">
    <p>&copy; 2026 HoneyShop. Всички права запазени.</p>
</footer>

</body>
</html>
