<!DOCTYPE html>
<html lang='bg' xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>HoneyShop - Управление на поръчки</title>
    <link rel='stylesheet' th:href="@{/css/style.css}">
</head>
<body>
<div class='top-strip'>🐝 Добре дошли в HoneyShop — натурален мед и пчелни продукти</div>
<header class="site-header">
    <div th:with="activePage='admin-orders'"
         th:replace="~{fragments/navigation_bar :: nav-bar}">
    </div>
</header>
<section class='page-hero'>
    <div class='container'><h1>Управление на поръчки</h1>
        <p>Преглед и промяна на статуса на поръчките.</p></div>
</section>
<section class='section'>
    <div class='container'>
        <div class='table-card'><h2>Поръчки</h2>
            <div class='table-responsive'>
                <table>
                    <thead>
                    <tr>
                        <th>№</th>
                        <th>Клиент</th>
                        <th>Email</th>
                        <th>Дата</th>
                        <th>Статус</th>
                        <th>Сума</th>
                        <th>Промяна</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="order, iterStat : ${orders}">
                        <td th:text="${iterStat.count}">1</td>
                        <td th:text="${order.customerName}">Иван Иванов</td>
                        <td th:text="${order.customerEmail}">user@email.com</td>
                        <td th:text="${#temporals.format(order.createdOn, 'dd.MM.yyyy HH:mm')}">22.05.2026</td>
                        <td th:text="${order.status}">NEW</td>
                        <td th:text="${order.totalPrice}">24.00</td>
                        <td>
                            <form th:action="@{/orders/{id}/status(id=${order.id})}" th:object="${updateOrderStatusRequest}" method="post">
                                <select name="status">
                                    <option th:each="status : ${orderStatuses}"
                                        th:value="${status}"
                                        th:text="${status}"
                                        th:selected="${status == order.status}">
                                        NEW
                                    </option>
                                </select>
                                <p class="error" th:if="${#fields.hasErrors('status')}" th:errors="*{status}"></p>

                                <button class="btn light" type="submit">Запази</button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</section>
<footer class='site-footer'><p>&copy; 2026 HoneyShop. Всички права запазени.</p></footer>
</body>
</html>
