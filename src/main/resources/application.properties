spring.application.name=Honey Shop Application

spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

logging.level.org.hibernate.persister.entity=ERROR

users.default-user.name=Galina
users.default-user.email=galina.k.georgieva@abv.bg
users.default-user.country=BULGARIA

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Cache configuration
spring.cache.type=caffeine
spring.cache.cache-names=activeProducts,allProducts,productsById
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=10m,recordStats

scheduling.zone=${SCHEDULING_ZONE:Europe/Sofia}
scheduling.products.deactivate-out-of-stock-cron=${PRODUCT_DEACTIVATION_CRON:0 0 2 * * *}
scheduling.cart.cleanup-fixed-delay=${CART_CLEANUP_FIXED_DELAY:3600000}
review.service.base-url=${REVIEW_SERVICE_BASE_URL:http://localhost:8081}