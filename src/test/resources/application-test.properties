spring.datasource.url=jdbc:h2:mem:honey_shop_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

spring.cache.type=none

users.default-user.name=Test Admin
users.default-user.password=test-password
users.default-user.email=test-admin@example.com
users.default-user.country=BULGARIA

review.service.base-url=http://localhost:8081